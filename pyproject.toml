[project]
name = "appfactory"
version = "0.1.3"
description = "Open-source MCP server that takes an iOS subscription app from idea to the App Store"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AppFactory contributors" }]
keywords = ["mcp", "ios", "app-store", "swiftui", "claude-code", "codex", "gemini"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=2.3.0",
  "httpx>=0.27",
]

[project.scripts]
appfactory = "appfactory.cli:main"
appfactory-mcp = "appfactory.cli:mcp_main"

[project.optional-dependencies]
# mascot_blink (eye detection + inpaint): `uv sync --extra mascot`
mascot = [
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/gbatistuta0/appfactory"
Repository = "https://github.com/gbatistuta0/appfactory"
Issues = "https://github.com/gbatistuta0/appfactory/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appfactory"]

# app scaffold templates live at the repo root; ship them inside the package
[tool.hatch.build.targets.wheel.force-include]
"templates" = "appfactory/templates"

[tool.hatch.build.targets.sdist]
exclude = ["docs/superpowers", ".claude", ".scratch"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
