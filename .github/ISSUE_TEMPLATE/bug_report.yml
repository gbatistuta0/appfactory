name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Do not paste secrets.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Claude Code / Codex CLI / Gemini CLI / Cursor
  - type: textarea
    id: doctor
    attributes:
      label: Output of `appfactory doctor`
      render: text
